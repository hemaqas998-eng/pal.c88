name: Generate package-lock.json and commit
permissions:
  contents: write

on:
  push:
    branches:
      - feature/security-auth-price-fixes
  workflow_dispatch:

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure package-lock at repo root if package.json exists
        id: root_lock
        run: |
          set -e
          CHANGED=0
          if [ -f package.json ]; then
            echo "Found package.json at repo root — running npm install..."
            npm install --legacy-peer-deps || npm install --no-audit --prefer-offline || true
            if [ -f package-lock.json ]; then
              git add package-lock.json
              CHANGED=1
            fi
          else
            echo "No package.json at repo root."
          fi
          echo "changed_root=$CHANGED" >> $GITHUB_OUTPUT

      - name: Ensure package-lock in frontend/ if package.json exists there
        id: frontend_lock
        run: |
          set -e
          CHANGED=0
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "Found frontend/package.json — running npm install in frontend/..."
            (cd frontend && npm install --legacy-peer-deps) || (cd frontend && npm install --no-audit --prefer-offline) || true
            if [ -f frontend/package-lock.json ]; then
              git add frontend/package-lock.json
              CHANGED=1
            fi
          else
            echo "No frontend/package.json found."
          fi
          echo "changed_frontend=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit & push lockfiles if any
        if: steps.root_lock.outputs.changed_root == '1' || steps.frontend_lock.outputs.changed_frontend == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: add package-lock.json (generated by Action)" || echo "No changes to commit"
          git push origin HEAD:feature/security-auth-price-fixes
