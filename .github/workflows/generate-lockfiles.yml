name: Generate package-lock.json and commit
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - feature/security-auth-price-fixes

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (use Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show node/npm versions
        run: |
          node -v
          npm -v

      - name: Clean old lockfiles (if present) to force regen
        run: |
          set -e
          # remove stale lockfiles to avoid "in sync" issues
          [ -f package-lock.json ] && rm -f package-lock.json && echo "removed root package-lock.json" || echo "no root lockfile"
          [ -f frontend/package-lock.json ] && rm -f frontend/package-lock.json && echo "removed frontend lockfile" || echo "no frontend lockfile"

      - name: Install (root) and generate package-lock.json if package.json exists
        id: root_lock
        run: |
          set -e
          CHANGED=0
          if [ -f package.json ]; then
            echo "Found package.json at repo root — running npm install..."
            # try robust install (legacy peer deps helps many modern packages)
            npm install --legacy-peer-deps --no-audit --prefer-offline || npm install --no-audit --prefer-offline || true
            if [ -f package-lock.json ]; then
              git add package-lock.json
              CHANGED=1
              echo "Generated root package-lock.json"
            fi
          else
            echo "No package.json at repo root."
          fi
          echo "changed_root=$CHANGED" >> $GITHUB_OUTPUT

      - name: Install (frontend) and generate frontend/package-lock.json if frontend/package.json exists
        id: frontend_lock
        run: |
          set -e
          CHANGED=0
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "Found frontend/package.json — running npm install in frontend/..."
            (cd frontend && npm install --legacy-peer-deps --no-audit --prefer-offline) || (cd frontend && npm install --no-audit --prefer-offline) || true
            if [ -f frontend/package-lock.json ]; then
              git add frontend/package-lock.json
              CHANGED=1
              echo "Generated frontend/package-lock.json"
            fi
          else
            echo "No frontend/package.json found."
          fi
          echo "changed_frontend=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit & push lockfiles if any
        if: steps.root_lock.outputs.changed_root == '1' || steps.frontend_lock.outputs.changed_frontend == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: add/update package-lock.json (generated by CI)" || echo "No changes to commit"
          git push origin HEAD:feature/security-auth-price-fixes
