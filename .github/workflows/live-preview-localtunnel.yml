name: Live Preview (localtunnel)
on:
  push:
    branches: [ feature/security-auth-price-fixes ]
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Start server (background) and wait for readiness
        env:
          NODE_ENV: development
          PORT: 3000
        run: |
          # Prefer a start script that runs the server in production mode.
          # If you only have dev, try using 'npm run start' or 'node server/index.js'
          if npm run start --if-present; then
            npm run start & echo $! > server.pid
          elif npm run dev --if-present; then
            npm run dev & echo $! > server.pid
          else
            # try node entry
            node server/index.js & echo $! > server.pid || true
          fi

          # wait for server to respond
          for i in {1..20}; do
            if curl -sSf http://localhost:3000/ > /dev/null; then
              echo "Server is up"; break
            else
              echo "waiting for server... ($i)"; sleep 2
            fi
          done

      - name: Start localtunnel and print URL
        run: |
          # install localtunnel if needed and start it
          npx -y localtunnel --port 3000 --subdomain palc88-${{ github.run_id }} > lt.url 2>&1 &
          # give it time and then print the file
          sleep 5
          echo "---- localtunnel output ----"
          cat lt.url || true
          echo "---- end output ----"

      - name: Keep job alive briefly for inspection
        run: |
          echo "Preview started. Logs above include the public URL if localtunnel succeeded."
          # Show a little info and then exit
          ps aux | head -n 20 || true
