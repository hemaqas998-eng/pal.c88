name: Live Preview (localtunnel)
permissions:
  contents: write

on:
  push:
    branches: [ feature/security-auth-price-fixes ]
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --prefer-offline || npm install --legacy-peer-deps --no-audit --prefer-offline
          else
            npm install --legacy-peer-deps --no-audit --prefer-offline
          fi

      - name: Start server (background) and wait for readiness
        env:
          NODE_ENV: development
          PORT: 3000
        run: |
          if npm run start --if-present; then
            npm run start & echo $! > server.pid
          elif npm run dev --if-present; then
            npm run dev & echo $! > server.pid
          else
            node server/index.js & echo $! > server.pid || true
          fi
          for i in {1..20}; do
            if curl -sSf http://localhost:3000/ > /dev/null; then
              echo "Server is up"; break
            else
              echo "waiting for server... ($i)"; sleep 2
            fi
          done

      - name: Start localtunnel and print URL
        run: |
          npx -y localtunnel --port 3000 --subdomain palc88-${{ github.run_id }} > lt.url 2>&1 &
          sleep 5
          echo "---- localtunnel output ----"
          cat lt.url || true
          echo "---- end output ----"

      - name: Keep job alive briefly for inspection
        run: |
          echo "Preview started. If localtunnel succeeded, public URL printed above."
