name: Deploy Frontend to GitHub Pages
permissions:
  contents: write

on:
  push:
    branches: [ feature/security-auth-price-fixes, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies (root) — prefer ci
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --prefer-offline || npm ci --no-audit
          else
            npm install --legacy-peer-deps --no-audit --prefer-offline || npm install --legacy-peer-deps --no-audit
          fi

      - name: Try build from common locations and collect into dist-out
        run: |
          rm -rf dist-out
          if npm run build --if-present; then
            if [ -d ./dist ]; then mv ./dist dist-out; elif [ -d ./build ]; then mv ./build dist-out; fi
          fi
          if [ -d frontend ]; then
            (cd frontend && npm cache clean --force)
            (cd frontend && if [ -f package-lock.json ]; then npm ci --no-audit --prefer-offline || npm ci --no-audit; else npm install --legacy-peer-deps --no-audit --prefer-offline || npm install --legacy-peer-deps --no-audit; fi)
            (cd frontend && npm run build --if-present) || true
            if [ -d frontend/dist ]; then mv frontend/dist dist-out || true; fi
            if [ -d frontend/build ]; then mv frontend/build dist-out || true; fi
          fi
          if [ ! -d dist-out ]; then
            mkdir -p dist-out
            echo "<html><body><h1>No frontend build found</h1></body></html>" > dist-out/index.html
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-out
